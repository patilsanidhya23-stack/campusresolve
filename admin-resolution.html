```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Complaint | CampusResolve</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        Campus<span>Resolve</span>
    </div>


    <nav>

        <a href="admin-dashboard.html">
            Dashboard
        </a>

        <a href="index.html">
            Logout
        </a>

    </nav>

</header>



<section class="resolution-page">


    <div class="resolution-container">


        <h1>
            Manage Complaint 🛠️
        </h1>


        <p class="resolution-intro">
            Review the complaint and update its resolution.
        </p>



        <div class="resolution-card">


            <div class="resolution-heading">


                <div>


                    <span
                        class="complaint-id"
                        id="complaintId">

                        Complaint

                    </span>


                    <h2 id="complaintSubject">

                        Loading...

                    </h2>


                </div>



                <span
                    id="currentStatus"
                    class="status pending">

                    Pending

                </span>


            </div>



            <div
                class="resolution-details"
                id="complaintDetails">

            </div>



            <div class="description-box">


                <h3>
                    Complaint Description
                </h3>


                <p id="complaintDescription">

                </p>


            </div>



            <form id="resolutionForm">


                <label for="status">

                    Update Complaint Status

                </label>


                <select id="status" required>


                    <option value="">

                        Select Status

                    </option>


                    <option value="Pending">

                        Pending

                    </option>


                    <option value="Under Review">

                        Under Review

                    </option>


                    <option value="In Progress">

                        In Progress

                    </option>


                    <option value="Resolved">

                        Resolved

                    </option>


                    <option value="Rejected">

                        Rejected

                    </option>


                </select>



                <label for="department">

                    Assign Department

                </label>


                <select id="department" required>


                    <option value="">

                        Select Department

                    </option>


                    <option value="Maintenance">

                        Maintenance

                    </option>


                    <option value="IT Department">

                        IT Department

                    </option>


                    <option value="Hostel Department">

                        Hostel Department

                    </option>


                    <option value="Library Department">

                        Library Department

                    </option>


                    <option value="Administration">

                        Administration

                    </option>


                </select>



                <label for="resolution">

                    Resolution / Admin Remark

                </label>


                <textarea
                    id="resolution"
                    rows="6"
                    placeholder="Enter the action taken or resolution..."
                    required></textarea>



                <button type="submit">

                    ✅ Update Complaint

                </button>


            </form>



            <a
                href="admin-dashboard.html"
                class="back-button">

                ← Back to Admin Dashboard

            </a>


        </div>

    </div>

</section>



<script>


/* =====================================================
   GET COMPLAINT ID FROM URL
===================================================== */


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const selectedComplaintId =
    urlParams.get("id");



/* =====================================================
   GET ALL COMPLAINTS
===================================================== */


function getAllComplaints() {


    let data =
        localStorage.getItem(
            "allComplaints"
        );


    if (!data) {

        return [];

    }


    try {

        const complaints =
            JSON.parse(data);


        if (Array.isArray(complaints)) {

            return complaints;

        }


        return [];


    } catch (error) {

        console.error(
            "Error reading complaints:",
            error
        );


        return [];

    }

}



/* =====================================================
   FIND CURRENT COMPLAINT
===================================================== */


function getCurrentComplaint() {


    const complaints =
        getAllComplaints();


    return complaints.find(
        function(complaint) {

            return (
                String(complaint.id) ===
                String(selectedComplaintId)
            );

        }
    );

}



/* =====================================================
   LOAD COMPLAINT
===================================================== */


window.onload = function() {


    const complaint =
        getCurrentComplaint();



    if (!complaint) {


        document.querySelector(
            ".resolution-card"
        ).innerHTML = `

            <h2>
                Complaint Not Found ❌
            </h2>

            <p>
                Complaint ID:
                <strong>
                    ${selectedComplaintId}
                </strong>
                was not found.
            </p>

            <br>

            <a
                href="admin-dashboard.html"
                class="back-button">

                ← Back to Admin Dashboard

            </a>

        `;


        return;

    }



    /* Complaint ID */


    document.getElementById(
        "complaintId"
    ).innerText =
        "Complaint #" +
        complaint.id;



    /* Subject */


    document.getElementById(
        "complaintSubject"
    ).innerText =
        complaint.subject;



    /* Description */


    document.getElementById(
        "complaintDescription"
    ).innerText =
        complaint.description;



    /* Details */


    document.getElementById(
        "complaintDetails"
    ).innerHTML = `

        <p>

            <strong>Category:</strong>
            ${complaint.category}

        </p>


        <p>

            <strong>Location:</strong>
            ${complaint.location}

        </p>


        <p>

            <strong>Priority:</strong>
            ${complaint.priority}

        </p>


        <p>

            <strong>Submitted By:</strong>

            ${
                complaint.anonymous
                ? "Anonymous Student"
                : "Student"
            }

        </p>


        <p>

            <strong>Submitted:</strong>
            ${complaint.date}

        </p>

    `;



    /* Current status */


    document.getElementById(
        "status"
    ).value =
        complaint.status || "Pending";



    document.getElementById(
        "currentStatus"
    ).innerText =
        complaint.status || "Pending";



    updateStatusStyle(
        complaint.status || "Pending"
    );



    /* Department */


    if (
        complaint.department &&
        complaint.department !== "Not Assigned"
    ) {

        document.getElementById(
            "department"
        ).value =
            complaint.department;

    }



    /* Resolution */


    if (
        complaint.resolution &&
        complaint.resolution !==
        "No resolution yet"
    ) {

        document.getElementById(
            "resolution"
        ).value =
            complaint.resolution;

    }

};



/* =====================================================
   STATUS STYLE
===================================================== */


function updateStatusStyle(status) {


    const statusBox =
        document.getElementById(
            "currentStatus"
        );


    statusBox.className =
        "status";



    if (
        status === "Resolved"
    ) {

        statusBox.classList.add(
            "resolved"
        );

    }

    else if (
        status === "Under Review" ||
        status === "In Progress"
    ) {

        statusBox.classList.add(
            "review"
        );

    }

    else if (
        status === "Rejected"
    ) {

        statusBox.classList.add(
            "rejected"
        );

    }

    else {

        statusBox.classList.add(
            "pending"
        );

    }

}



/* =====================================================
   UPDATE COMPLAINT
===================================================== */


document
.getElementById("resolutionForm")
.addEventListener(
    "submit",
    function(event) {


        event.preventDefault();



        /* Get latest data AGAIN */


        const complaints =
            getAllComplaints();



        /* Find exact complaint */


        const index =
            complaints.findIndex(
                function(complaint) {

                    return (
                        String(complaint.id) ===
                        String(selectedComplaintId)
                    );

                }
            );



        /* Complaint doesn't exist */


        if (index === -1) {


            alert(
                "Complaint not found ❌"
            );


            return;

        }



        /* Get new values */


        const newStatus =
            document
            .getElementById("status")
            .value;


        const newDepartment =
            document
            .getElementById("department")
            .value;


        const newResolution =
            document
            .getElementById("resolution")
            .value
            .trim();



        /* Validation */


        if (
            newStatus === "" ||
            newDepartment === "" ||
            newResolution === ""
        ) {


            alert(
                "Please fill all fields."
            );


            return;

        }



        /* =========================================
           UPDATE EXACT COMPLAINT
        ========================================= */


        complaints[index].status =
            newStatus;


        complaints[index].department =
            newDepartment;


        complaints[index].resolution =
            newResolution;



        /* =========================================
           SAVE UPDATED COMPLAINTS
        ========================================= */


        localStorage.setItem(
            "allComplaints",
            JSON.stringify(
                complaints
            )
        );



        /* =========================================
           UPDATE SCREEN
        ========================================= */


        document.getElementById(
            "currentStatus"
        ).innerText =
            newStatus;


        updateStatusStyle(
            newStatus
        );



        /* =========================================
           SUCCESS
        ========================================= */


        alert(

            "Complaint #" +
            selectedComplaintId +
            " updated successfully! ✅"

        );


    }
);

</script>



<footer>


    <h3>

        Campus<span>Resolve</span>

    </h3>


    <p>

        College Complaint & Resolution System

    </p>


</footer>


</body>

</html>
```
