```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Complaint | CampusResolve</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header>

    <div class="logo">
        Campus<span>Resolve</span>
    </div>


    <nav>

        <a href="admin-dashboard.html">
            Dashboard
        </a>

        <a href="index.html">
            Logout
        </a>

    </nav>

</header>



<section class="resolution-page">


    <div class="resolution-container">


        <h1>
            Manage Complaint 🛠️
        </h1>


        <p class="resolution-intro">
            Review the complaint and update its resolution.
        </p>



        <div class="resolution-card">


            <div class="resolution-heading">


                <div>


                    <span
                        class="complaint-id"
                        id="complaintId">

                        Complaint

                    </span>


                    <h2 id="complaintSubject">

                        Loading...

                    </h2>


                </div>



                <span
                    id="currentStatus"
                    class="status pending">

                    Pending

                </span>


            </div>



            <div
                class="resolution-details"
                id="complaintDetails">

            </div>



            <div class="description-box">


                <h3>
                    Complaint Description
                </h3>


                <p id="complaintDescription">

                </p>


            </div>



            <form
                id="resolutionForm"
                onsubmit="updateComplaint(event)">


                <label for="status">

                    Update Complaint Status

                </label>


                <select id="status" required>


                    <option value="">
                        Select Status
                    </option>


                    <option value="Pending">
                        Pending
                    </option>


                    <option value="Under Review">
                        Under Review
                    </option>


                    <option value="In Progress">
                        In Progress
                    </option>


                    <option value="Resolved">
                        Resolved
                    </option>


                    <option value="Rejected">
                        Rejected
                    </option>


                </select>



                <label for="department">

                    Assign Department

                </label>


                <select id="department" required>


                    <option value="">
                        Select Department
                    </option>


                    <option>
                        Maintenance
                    </option>


                    <option>
                        IT Department
                    </option>


                    <option>
                        Hostel Department
                    </option>


                    <option>
                        Library Department
                    </option>


                    <option>
                        Administration
                    </option>


                </select>



                <label for="resolution">

                    Resolution / Admin Remark

                </label>


                <textarea
                    id="resolution"
                    rows="6"
                    placeholder="Enter the action taken or resolution..."
                    required></textarea>



                <button type="submit">

                    ✅ Update Complaint

                </button>


            </form>



            <a
                href="admin-dashboard.html"
                class="back-button">

                ← Back to Admin Dashboard

            </a>


        </div>

    </div>

</section>



<script>


/* ==========================================
   GET COMPLAINT ID FROM URL
========================================== */


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const selectedComplaintId =
    urlParams.get("id");



/* ==========================================
   GET ALL COMPLAINTS
========================================== */


let complaints =
    JSON.parse(
        localStorage.getItem("allComplaints")
    ) || [];



/* ==========================================
   FIND EXACT COMPLAINT
========================================== */


let selectedComplaint =
    complaints.find(
        function (complaint) {

            return complaint.id === selectedComplaintId;

        }
    );



/* ==========================================
   LOAD COMPLAINT
========================================== */


window.onload = function () {


    if (!selectedComplaint) {


        document.querySelector(
            ".resolution-card"
        ).innerHTML = `

            <h2>
                Complaint Not Found ❌
            </h2>

            <p>
                The complaint ID
                <strong>${selectedComplaintId}</strong>
                was not found.
            </p>

            <br>

            <a
                href="admin-dashboard.html"
                class="back-button">

                ← Back to Admin Dashboard

            </a>

        `;


        return;

    }



    document.getElementById(
        "complaintId"
    ).innerText =
        "Complaint #" +
        selectedComplaint.id;



    document.getElementById(
        "complaintSubject"
    ).innerText =
        selectedComplaint.subject;



    document.getElementById(
        "complaintDescription"
    ).innerText =
        selectedComplaint.description;



    document.getElementById(
        "complaintDetails"
    ).innerHTML = `

        <p>

            <strong>Category:</strong>
            ${selectedComplaint.category}

        </p>


        <p>

            <strong>Location:</strong>
            ${selectedComplaint.location}

        </p>


        <p>

            <strong>Priority:</strong>
            ${selectedComplaint.priority}

        </p>


        <p>

            <strong>Submitted By:</strong>
            ${
                selectedComplaint.anonymous
                ? "Anonymous Student"
                : "Student"
            }

        </p>


        <p>

            <strong>Submitted:</strong>
            ${selectedComplaint.date}

        </p>

    `;



    /*
    CURRENT STATUS
    */


    document.getElementById(
        "status"
    ).value =
        selectedComplaint.status;



    document.getElementById(
        "currentStatus"
    ).innerText =
        selectedComplaint.status;



    updateStatusStyle(
        selectedComplaint.status
    );



    /*
    EXISTING DEPARTMENT
    */


    if (
        selectedComplaint.department &&
        selectedComplaint.department !== "Not Assigned"
    ) {

        document.getElementById(
            "department"
        ).value =
            selectedComplaint.department;

    }



    /*
    EXISTING RESOLUTION
    */


    if (
        selectedComplaint.resolution &&
        selectedComplaint.resolution !== "No resolution yet"
    ) {

        document.getElementById(
            "resolution"
        ).value =
            selectedComplaint.resolution;

    }

};




/* ==========================================
   STATUS STYLE
========================================== */


function updateStatusStyle(status) {


    const statusBox =
        document.getElementById(
            "currentStatus"
        );


    statusBox.className =
        "status";



    if (
        status === "Resolved"
    ) {

        statusBox.classList.add(
            "resolved"
        );

    }

    else if (
        status === "Under Review" ||
        status === "In Progress"
    ) {

        statusBox.classList.add(
            "review"
        );

    }

    else if (
        status === "Rejected"
    ) {

        statusBox.classList.add(
            "rejected"
        );

    }

    else {

        statusBox.classList.add(
            "pending"
        );

    }

}



/* ==========================================
   UPDATE EXACT COMPLAINT
========================================== */


function updateComplaint(event) {


    event.preventDefault();



    /*
    Make sure complaint exists
    */


    if (!selectedComplaint) {

        alert(
            "Complaint not found."
        );

        return;

    }



    const newStatus =
        document.getElementById(
            "status"
        ).value;



    const newDepartment =
        document.getElementById(
            "department"
        ).value;



    const newResolution =
        document.getElementById(
            "resolution"
        ).value.trim();



    /*
    VALIDATION
    */


    if (
        newStatus === "" ||
        newDepartment === "" ||
        newResolution === ""
    ) {

        alert(
            "Please fill all fields."
        );

        return;

    }



    /*
    ==========================================
    FIND COMPLAINT AGAIN BY ID
    ==========================================
    */


    const index =
        complaints.findIndex(
            function (complaint) {

                return complaint.id === selectedComplaintId;

            }
        );



    if (index === -1) {


        alert(
            "Complaint could not be found."
        );


        return;

    }



    /*
    ==========================================
    UPDATE ONLY THAT COMPLAINT
    ==========================================
    */


    complaints[index].status =
        newStatus;


    complaints[index].department =
        newDepartment;


    complaints[index].resolution =
        newResolution;



    /*
    ==========================================
    SAVE COMPLETE ARRAY
    ==========================================
    */


    localStorage.setItem(
        "allComplaints",
        JSON.stringify(complaints)
    );



    /*
    ==========================================
    UPDATE PAGE
    ==========================================
    */


    selectedComplaint =
        complaints[index];



    document.getElementById(
        "currentStatus"
    ).innerText =
        newStatus;



    updateStatusStyle(
        newStatus
    );



    /*
    ==========================================
    SUCCESS
    ==========================================
    */


    alert(
        "Complaint " +
        selectedComplaintId +
        " has been updated successfully! ✅"
    );

}

</script>



<footer>

    <h3>

        Campus<span>Resolve</span>

    </h3>


    <p>

        College Complaint & Resolution System

    </p>


</footer>


</body>

</html>
```
