<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | CampusResolve</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <header>

        <div class="logo">
            Campus<span>Resolve</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Student Login
            </a>

        </nav>

    </header>


    <!-- Admin Login -->

    <section class="login-section">

        <div class="login-box">

            <div class="login-icon">
                🛡️
            </div>

            <h1>
                Admin Login
            </h1>

            <p>
                Access the CampusResolve administration panel.
            </p>


            <form onsubmit="adminLogin(event)">

                <label for="admin-email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter admin email"
                    required
                >


                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter admin password"
                    required
                >


                <button type="submit">
                    Admin Login
                </button>

            </form>

        </div>

    </section>


    <!-- Temporary Admin Login -->

    <script>

        function adminLogin(event) {

            event.preventDefault();

            window.location.href = "admin-dashboard.html";

        }

    </script>


</body>

</html>
