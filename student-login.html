```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | CampusResolve</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        Campus<span>Resolve</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
    </nav>

</header>


<section class="login-section">

    <div class="login-box">

        <div class="login-icon">
            👨‍🎓
        </div>

        <h1>
            Student Login
        </h1>

        <p>
            Login to submit and track your college complaints.
        </p>


        <form onsubmit="studentLogin(event)">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Student Login
            </button>

        </form>


        <a href="account-login.html"
           class="back-button">

            ← Back to Login Selection

        </a>

    </div>

</section>


<script>

function studentLogin(event) {

    event.preventDefault();

    window.location.href =
        "student-dashboard.html";

}

</script>


<footer>

    <h3>
        Campus<span>Resolve</span>
    </h3>

    <p>
        College Complaint & Resolution System
    </p>

</footer>

</body>

</html>
```
