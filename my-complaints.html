```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Complaints | CampusResolve</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        Campus<span>Resolve</span>
    </div>


    <nav>

        <a href="student-dashboard.html">
            Dashboard
        </a>

        <a href="complaint.html">
            New Complaint
        </a>

        <a href="index.html">
            Logout
        </a>

    </nav>

</header>



<section class="complaints-page">


    <div class="complaints-container">


        <h1>
            My Complaints
        </h1>


        <p class="complaints-intro">
            View and track all your submitted complaints.
        </p>



        <!-- ALL COMPLAINTS APPEAR HERE -->

        <div id="complaintsArea"></div>



        <div style="margin-top:30px;">

            <a href="student-dashboard.html"
               class="track-button">

                ← Back to Dashboard

            </a>

        </div>


    </div>

</section>



<script>


window.onload = function () {


    /*
    ==========================================
    GET ALL COMPLAINTS
    ==========================================
    */


    let complaints =
        JSON.parse(
            localStorage.getItem("allComplaints")
        ) || [];



    /*
    ==========================================
    OLD DATA SUPPORT
    ==========================================
    */


    if (complaints.length === 0) {


        const oldComplaint =
            localStorage.getItem("newComplaint");



        if (oldComplaint) {


            try {


                const complaint =
                    JSON.parse(oldComplaint);


                complaints.push(
                    complaint
                );


                localStorage.setItem(
                    "allComplaints",
                    JSON.stringify(complaints)
                );


            }

            catch(error) {

                console.error(
                    error
                );

            }

        }

    }



    const area =
        document.getElementById(
            "complaintsArea"
        );



    /*
    ==========================================
    NO COMPLAINTS
    ==========================================
    */


    if (complaints.length === 0) {


        area.innerHTML = `

            <div class="complaint-card">

                <h2>
                    No Complaints Yet
                </h2>

                <p>
                    You have not submitted any complaints.
                </p>

            </div>

        `;


        return;

    }



    /*
    ==========================================
    DISPLAY ALL COMPLAINTS
    ==========================================
    */


    area.innerHTML = "";



    /*
    Newest complaint first
    */


    complaints
    .slice()
    .reverse()
    .forEach(function(complaint) {


        /*
        -------------------------------
        STATUS CLASS
        -------------------------------
        */


        let statusClass =
            "pending";



        if (
            complaint.status === "Resolved"
        ) {

            statusClass =
                "resolved";

        }


        else if (
            complaint.status === "Under Review" ||
            complaint.status === "In Progress"
        ) {

            statusClass =
                "review";

        }


        else if (
            complaint.status === "Rejected"
        ) {

            statusClass =
                "rejected";

        }



        /*
        -------------------------------
        BUTTON TEXT
        -------------------------------
        */


        let buttonText =
            "🔍 Track Complaint";



        if (
            complaint.status === "Resolved"
        ) {

            buttonText =
                "✅ View Resolution";

        }



        /*
        -------------------------------
        DISPLAY
        -------------------------------
        */


        area.innerHTML += `

            <div class="complaint-card">


                <div class="complaint-top">


                    <div>


                        <span class="complaint-id">

                            Complaint #${complaint.id}

                        </span>


                        <h2>

                            ${complaint.subject}

                        </h2>


                    </div>



                    <span class="status ${statusClass}">

                        ${complaint.status}

                    </span>


                </div>



                <div class="complaint-details">


                    <p>

                        <strong>Category:</strong>
                        ${complaint.category}

                    </p>


                    <p>

                        <strong>Location:</strong>
                        ${complaint.location}

                    </p>


                    <p>

                        <strong>Priority:</strong>
                        ${complaint.priority}

                    </p>


                    <p>

                        <strong>Submitted:</strong>
                        ${complaint.date}

                    </p>


                    ${
                        complaint.department &&
                        complaint.department !== "Not Assigned"

                        ?

                        `<p>

                            <strong>Department:</strong>
                            ${complaint.department}

                        </p>`

                        :

                        ""

                    }



                    ${
                        complaint.status === "Resolved"

                        ?

                        `<p>

                            <strong>Resolution:</strong>
                            ${complaint.resolution}

                        </p>`

                        :

                        ""

                    }


                </div>



                <a
                    href="track.html?id=${complaint.id}"
                    class="track-button">

                    ${buttonText}

                </a>


            </div>

        `;


    });


};

</script>



<footer>

    <h3>
        Campus<span>Resolve</span>
    </h3>


    <p>
        College Complaint & Resolution System
    </p>


</footer>


</body>

</html>
