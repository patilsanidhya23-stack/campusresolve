```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint | CampusResolve</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        Campus<span>Resolve</span>
    </div>


    <nav>

        <a href="student-dashboard.html">
            Dashboard
        </a>

        <a href="my-complaints.html">
            My Complaints
        </a>

        <a href="index.html">
            Logout
        </a>

    </nav>

</header>



<section class="complaint-page">


    <div class="complaint-container">


        <h1>
            Submit a Complaint 📝
        </h1>


        <p class="complaint-intro">
            Tell us about the issue on your campus.
        </p>



        <form id="complaintForm">


            <!-- =========================
                 CATEGORY
            ========================== -->


            <label for="category">

                Complaint Category

            </label>


            <select
                id="category"
                required>


                <option value="">

                    Select Category

                </option>


                <option>
                    Infrastructure
                </option>


                <option>
                    Hostel
                </option>


                <option>
                    Library
                </option>


                <option>
                    Laboratory
                </option>


                <option>
                    IT / Computer
                </option>


                <option>
                    Canteen
                </option>


                <option>
                    Administration
                </option>


                <option>
                    Other
                </option>


            </select>



            <!-- =========================
                 LOCATION
            ========================== -->


            <label for="location">

                Problem Location

            </label>


            <input
                type="text"
                id="location"
                placeholder="Example: Library - 2nd Floor"
                required
            >



            <!-- =========================
                 PRIORITY
            ========================== -->


            <label for="priority">

                Priority

            </label>


            <select
                id="priority"
                required>


                <option value="">

                    Select Priority

                </option>


                <option>
                    Low
                </option>


                <option>
                    Medium
                </option>


                <option>
                    High
                </option>


            </select>



            <!-- =========================
                 SUBJECT
            ========================== -->


            <label for="subject">

                Complaint Subject

            </label>


            <input
                type="text"
                id="subject"
                placeholder="Enter complaint subject"
                required
            >



            <!-- =========================
                 DESCRIPTION
            ========================== -->


            <label for="description">

                Describe the Problem

            </label>


            <textarea
                id="description"
                rows="7"
                placeholder="Explain the problem clearly..."
                required></textarea>



            <!-- =========================
                 ANONYMOUS
            ========================== -->


            <label class="anonymous-option">


                <input
                    type="checkbox"
                    id="anonymous"
                >


                Submit this complaint anonymously


            </label>



            <!-- =========================
                 SUBMIT
            ========================== -->


            <button type="submit">

                🚀 Submit Complaint

            </button>


        </form>


    </div>

</section>



<script>


/* ==========================================
   SUBMIT COMPLAINT
========================================== */


document
.getElementById("complaintForm")
.addEventListener(
    "submit",
    function(event) {


        event.preventDefault();



        /* ==========================================
           GET FORM VALUES
        ========================================== */


        const category =
            document
            .getElementById("category")
            .value;


        const location =
            document
            .getElementById("location")
            .value
            .trim();


        const priority =
            document
            .getElementById("priority")
            .value;


        const subject =
            document
            .getElementById("subject")
            .value
            .trim();


        const description =
            document
            .getElementById("description")
            .value
            .trim();


        const anonymous =
            document
            .getElementById("anonymous")
            .checked;



        /* ==========================================
           GET ALL EXISTING COMPLAINTS
        ========================================== */


        let complaints =
            JSON.parse(
                localStorage.getItem(
                    "allComplaints"
                )
            ) || [];



        /*
        Make sure it is an array
        */


        if (!Array.isArray(complaints)) {

            complaints = [];

        }



        /* ==========================================
           GENERATE UNIQUE COMPLAINT ID
        ========================================== */


        let complaintId;


        do {


            const complaintNumber =
                Math.floor(
                    1000 +
                    Math.random() * 9000
                );


            complaintId =
                "CR" +
                complaintNumber;


        }

        while (
            complaints.some(
                function(complaint) {

                    return (
                        complaint.id ===
                        complaintId
                    );

                }
            )
        );



        /* ==========================================
           CREATE NEW COMPLAINT
        ========================================== */


        const complaint = {


            id:
                complaintId,


            category:
                category,


            location:
                location,


            priority:
                priority,


            subject:
                subject,


            description:
                description,


            anonymous:
                anonymous,


            status:
                "Pending",


            department:
                "Not Assigned",


            resolution:
                "No resolution yet",


            date:
                new Date()
                .toLocaleDateString()

        };



        /* ==========================================
           ADD NEW COMPLAINT
           WITHOUT DELETING OLD ONES
        ========================================== */


        complaints.push(
            complaint
        );



        /* ==========================================
           SAVE ALL COMPLAINTS
        ========================================== */


        localStorage.setItem(
            "allComplaints",
            JSON.stringify(
                complaints
            )
        );



        /* ==========================================
           SUCCESS MESSAGE
        ========================================== */


        alert(

            "Complaint submitted successfully! 🎉\n\n" +

            "Your Complaint ID is: " +

            complaintId

        );



        /* ==========================================
           OPEN MY COMPLAINTS
        ========================================== */


        window.location.href =
            "my-complaints.html";


    }
);

</script>



<footer>


    <h3>

        Campus<span>Resolve</span>

    </h3>


    <p>

        College Complaint & Resolution System

    </p>


</footer>


</body>

</html>
```
